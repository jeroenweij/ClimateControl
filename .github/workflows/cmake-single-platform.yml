# CI build for the STM32 firmware in Software/.
# Cross-compiles every module with arm-none-eabi-gcc; nothing here runs on the runner.
name: CMake on a single platform

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  BUILD_TYPE: Release
  # CMakeLists.txt lives in Software/, not at the repo root.
  SOURCE_DIR: ${{ github.workspace }}/Software
  BUILD_DIR: ${{ github.workspace }}/Software/build

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install ARM GNU toolchain
      uses: carlosperate/arm-none-eabi-gcc-action@v1
      with:
        release: '14.2.Rel1'

    - name: Configure CMake
      run: cmake -S ${{ env.SOURCE_DIR }} -B ${{ env.BUILD_DIR }} -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

    - name: Build
      run: cmake --build ${{ env.BUILD_DIR }} --config ${{ env.BUILD_TYPE }} -j

    - name: Size report
      run: arm-none-eabi-size ${{ env.BUILD_DIR }}/Modules/*/*.elf

    - name: Upload firmware images
      uses: actions/upload-artifact@v4
      with:
        name: firmware-${{ env.BUILD_TYPE }}
        path: |
          ${{ env.BUILD_DIR }}/Modules/*/*.elf
          ${{ env.BUILD_DIR }}/Modules/*/*.bin
          ${{ env.BUILD_DIR }}/Modules/*/*.hex

    # TODO: no tests exist yet - kept non-blocking until a test target lands.
    - name: Test
      continue-on-error: true
      working-directory: ${{ env.BUILD_DIR }}
      run: ctest -C ${{ env.BUILD_TYPE }}
